name: Feature request
description: Propose a new feature or enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe expected behavior and constraints.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security/privacy impact
      description: Note implications for IP privacy, auth, or agent permissions.
