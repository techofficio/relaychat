[package]
name = "relaychat-relay-node"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
relaychat-core = { path = "../core" }
relaychat-crypto = { path = "../crypto" }
relaychat-net = { path = "../net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
uuid = { version = "1", features = ["v4"] }
