[package]
name = "relaychat-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
relaychat-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
